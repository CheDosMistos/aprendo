name: Learner language diagnostic

on:
  push:
    branches:
      - chore/learner-facing-language-f1-f7

permissions:
  contents: read

env:
  BATERIA_LEARNER_LANGUAGE_MAX_PHASE: 7

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture learner-language audit
        shell: bash
        run: |
          set +e
          node scripts/audit-bateria-learner-language.mjs --enforce > learner-language-audit.txt 2>&1
          status=$?
          cat learner-language-audit.txt
          echo "AUDIT_EXIT_STATUS=$status" >> learner-language-audit.txt
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: learner-language-audit
          path: learner-language-audit.txt
          if-no-files-found: error

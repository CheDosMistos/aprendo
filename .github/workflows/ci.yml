name: Check aprendo

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Test Nginx auth migration
        run: |
          set -euo pipefail
          fixture="$(mktemp)"
          cat > "$fixture" <<'NGINX'
          server {
              listen 443 ssl;
              server_name aprendo.molacomer.com;
              root /var/www/aprendo.molacomer.com;
              auth_basic "Restricted";
              auth_basic_user_file /etc/nginx/.htpasswd;
              location /api/ {
                  proxy_pass http://127.0.0.1:4321;
              }
              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          python3 ops/configure-nginx-app-auth.py "$fixture"
          ! grep -q 'auth_basic' "$fixture"
          grep -q 'location / {' "$fixture"
          grep -q 'proxy_pass http://127.0.0.1:4321;' "$fixture"
          grep -q 'location /api/' "$fixture"

      - name: Build site
        run: npm run build

      - name: Verify runtime build
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs
          test -d dist/client/_astro

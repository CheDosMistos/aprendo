name: Learner language final repair

on:
  push:
    branches:
      - chore/learner-facing-language-f1-f7

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/learner-facing-language-f1-f7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded repair
        run: node scripts/repair-learner-language-final.mjs
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/courses/bateria/content/pages
          git commit -m "Polish final learner-facing artifacts [semantic-repair]"
          git push origin HEAD:chore/learner-facing-language-f1-f7

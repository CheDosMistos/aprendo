name: Learner language audit

on:
  push:
    branches:
      - chore/learner-facing-language-f1-f7

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit learner-facing language
        run: node scripts/audit-bateria-learner-language.mjs

name: Deploy aprendo

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-aprendo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Select safe static deploy output
        run: |
          set -euo pipefail

          if [ -d dist/client ]; then
            test -f dist/client/index.html
            test -f dist/client/bateria/index.html
            test -f dist/server/entry.mjs
            echo 'DEPLOY_SOURCE=dist/client' >> "$GITHUB_ENV"
          else
            test -f dist/index.html
            test -f dist/bateria/index.html
            echo 'DEPLOY_SOURCE=dist' >> "$GITHUB_ENV"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy static client with rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$DEPLOY_SOURCE"

          rsync -az \
            --delete-delay \
            --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            "$DEPLOY_SOURCE/" \
            "$VPS_USER@$VPS_HOST:/var/www/aprendo.molacomer.com/"

      - name: Verify deployed files on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'test -f /var/www/aprendo.molacomer.com/index.html && test -f /var/www/aprendo.molacomer.com/bateria/index.html'

      - name: Verify HTTPS protection
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT

          status="$(curl \
            --silent \
            --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 20 \
            https://aprendo.molacomer.com/)"

          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 from protected site, got $status" >&2
            exit 1
          fi

          if ! grep -qi '^www-authenticate: Basic' "$headers_file"; then
            echo "Expected Basic authentication challenge header" >&2
            exit 1
          fi

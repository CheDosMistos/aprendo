name: Deploy aprendo

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-aprendo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs
          test -d dist/client/_astro

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify VPS runtime prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             test -x /opt/aprendo-node/bin/node
             test -x /opt/aprendo-node/bin/npm
             test -x /usr/bin/python3
             test -x /usr/sbin/nginx
             test -d /opt/aprendo/runtime
             test -w /opt/aprendo/runtime
             test -d /var/lib/aprendo
             test -w /var/lib/aprendo
             mkdir -p /opt/aprendo/runtime/releases
             test -w /opt/aprendo/runtime/releases
             /opt/aprendo-node/bin/node --version

             echo "--- effective aprendo.service ---"
             /usr/bin/systemctl show aprendo.service --no-pager \
               --property=MainPID,User,ExecStart,Environment,FragmentPath || true
             pid="$(/usr/bin/systemctl show aprendo.service --property=MainPID --value 2>/dev/null || true)"
             if [ -n "$pid" ] && [ "$pid" != "0" ]; then
               printf "process cwd: "; readlink "/proc/$pid/cwd" 2>/dev/null || true
               printf "process APRENDO_DB_PATH: "
               tr "\0" "\n" < "/proc/$pid/environ" 2>/dev/null | grep "^APRENDO_DB_PATH=" || echo "<unset or unreadable>"
               echo "open SQLite descriptors:"
               ls -l "/proc/$pid/fd" 2>/dev/null | grep -E "sqlite|/var/lib/aprendo" || true
             fi

             echo "--- deploy sudo policy ---"
             sudo -n -l 2>&1 || true

             echo "--- Aprendo disk footprint ---"
             df -h /
             du -sh /opt/aprendo-node /opt/aprendo/runtime /var/lib/aprendo 2>/dev/null || true
             du -sh /opt/aprendo/runtime/releases/* 2>/dev/null || true
             du -sh /var/lib/aprendo/backups /var/lib/aprendo/avatars /var/lib/aprendo/aprendo.sqlite 2>/dev/null || true'

      - name: Prune inactive releases before staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             releases=/opt/aprendo/runtime/releases
             current=/opt/aprendo/runtime/current
             active=""
             if [ -L "$current" ]; then active="$(readlink -f "$current")"; fi
             for candidate in "$releases"/*; do
               [ -d "$candidate" ] || continue
               resolved="$(readlink -f "$candidate")"
               if [ -n "$active" ] && [ "$resolved" = "$active" ]; then continue; fi
               rm -rf -- "$candidate"
             done
             df -h /opt/aprendo/runtime /var/lib/aprendo'

      - name: Prepare immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA=$RELEASE_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          runtime=/opt/aprendo/runtime
          releases="$runtime/releases"
          release="$releases/$RELEASE_SHA"
          current="$(readlink -f "$runtime/current" 2>/dev/null || true)"

          # Failed deploys can leave full release directories behind. Remove the
          # target from any previous attempt, then keep current plus at most two
          # recent non-current releases before allocating space for the new one.
          rm -rf -- "$release" "$runtime"/.current-next-*
          mapfile -t candidates < <(find "$releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | awk '{print $2}')
          kept=0
          for candidate in "${candidates[@]}"; do
            if [ -n "$current" ] && [ "$candidate" = "$current" ]; then
              continue
            fi
            kept=$((kept + 1))
            if [ "$kept" -gt 2 ]; then
              rm -rf -- "$candidate"
            fi
          done

          mkdir -p "$release"
          df -Pk "$runtime" /var/lib/aprendo
          REMOTE

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/opt/aprendo/runtime/releases/$RELEASE_SHA/"

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            package.json package-lock.json \
            "$VPS_USER@$VPS_HOST:/opt/aprendo/runtime/releases/$RELEASE_SHA/"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd /opt/aprendo/runtime/releases/$RELEASE_SHA; export PATH=/opt/aprendo-node/bin:\$PATH; npm ci --omit=dev --no-audit --no-fund; test -f server/entry.mjs; test -d client/_astro"

      - name: Upload deployment helpers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ops/backup-sqlite.py ops/activate-release.sh ops/verify-production-contract.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Activate release with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; APRENDO_BACKUP_HELPER=/tmp/backup-sqlite.py bash /tmp/activate-release.sh $RELEASE_SHA"

      - name: Configure Nginx as plain platform proxy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ops/configure-nginx-platform-proxy.py \
            "$VPS_USER@$VPS_HOST:/tmp/aprendo-configure-nginx-platform-proxy.py"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             config="$(sudo -n /usr/sbin/nginx -T 2>&1 | awk '\''/^# configuration file / { file=$4; sub(/:$/, "", file) } /server_name[[:space:]][^;]*aprendo\.molacomer\.com/ { print file; exit }'\'')"
             test -n "$config"
             sudo -n /usr/bin/python3 /tmp/aprendo-configure-nginx-platform-proxy.py "$config"
             sudo -n /usr/sbin/nginx -t
             sudo -n /usr/bin/systemctl reload nginx'

      - name: Verify versioned production contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail; bash /tmp/verify-production-contract.sh'

      - name: Verify HTTPS platform login
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          login_file="$(mktemp)"
          account_headers="$(mktemp)"
          asset_headers="$(mktemp)"
          trap 'rm -f "$headers_file" "$login_file" "$account_headers" "$asset_headers"' EXIT

          status="$(curl \
            --silent \
            --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 20 \
            https://aprendo.molacomer.com/)"

          test "$status" = "303"
          grep -qi '^location: /login/' "$headers_file"
          ! grep -qi '^www-authenticate: Basic' "$headers_file"

          login_status="$(curl --silent --show-error --output "$login_file" --write-out '%{http_code}' https://aprendo.molacomer.com/login/)"
          test "$login_status" = "200"
          grep -q 'name="username"' "$login_file"
          grep -q 'name="password"' "$login_file"

          account_status="$(curl --silent --show-error --dump-header "$account_headers" --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/cuenta/)"
          test "$account_status" = "303"
          grep -qi '^location: /login/' "$account_headers"

          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/api/progress/bateria/)"
          test "$api_status" = "401"

          asset_status="$(curl --silent --show-error --dump-header "$asset_headers" --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/bateria/notation/u1/lectura-diagnostico-a1-a2.musicxml)"
          test "$asset_status" = "303"
          grep -qi '^location: /login/' "$asset_headers"

name: Deploy aprendo

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-aprendo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs
          test -d dist/client/_astro
          max_dist_kb=131072
          dist_kb="$(du -sk dist | cut -f1)"
          printf 'dist size: %s KiB (limit %s KiB)\n' "$dist_kb" "$max_dist_kb"
          if [ "$dist_kb" -gt "$max_dist_kb" ]; then
            echo "Build output exceeds the 128 MiB deployment budget." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify VPS runtime prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             test -x /opt/aprendo-node/bin/node
             test -x /opt/aprendo-node/bin/npm
             test -x /usr/bin/python3
             test -d /opt/aprendo/runtime
             test -w /opt/aprendo/runtime
             test -d /var/lib/aprendo
             test -w /var/lib/aprendo
             mkdir -p /opt/aprendo/runtime/releases
             test -w /opt/aprendo/runtime/releases
             /opt/aprendo-node/bin/node --version

             echo "--- effective aprendo.service ---"
             /usr/bin/systemctl show aprendo.service --no-pager \
               --property=MainPID,User,ExecStart,Environment,FragmentPath || true
             pid="$(/usr/bin/systemctl show aprendo.service --property=MainPID --value 2>/dev/null || true)"
             if [ -n "$pid" ] && [ "$pid" != "0" ]; then
               printf "process cwd: "; readlink "/proc/$pid/cwd" 2>/dev/null || true
               printf "process APRENDO_DB_PATH: "
               tr "\0" "\n" < "/proc/$pid/environ" 2>/dev/null | grep "^APRENDO_DB_PATH=" || echo "<unset or unreadable>"
               echo "open SQLite descriptors:"
               ls -l "/proc/$pid/fd" 2>/dev/null | grep -E "sqlite|/var/lib/aprendo" || true
             fi

             echo "--- deploy sudo policy ---"
             sudo -n -l 2>&1 || true

             echo "--- Aprendo disk footprint before staging ---"
             df -h /
             du -sh /opt/aprendo-node /opt/aprendo/runtime /var/lib/aprendo 2>/dev/null || true
             du -sh /opt/aprendo/runtime/releases/* 2>/dev/null || true
             du -sh /var/lib/aprendo/backups /var/lib/aprendo/avatars /var/lib/aprendo/aprendo.sqlite 2>/dev/null || true'

      - name: Prune inactive releases before staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             releases=/opt/aprendo/runtime/releases
             current=/opt/aprendo/runtime/current
             active=""
             if [ -L "$current" ]; then active="$(readlink -f "$current")"; fi
             for candidate in "$releases"/*; do
               [ -d "$candidate" ] || continue
               resolved="$(readlink -f "$candidate")"
               if [ -n "$active" ] && [ "$resolved" = "$active" ]; then continue; fi
               rm -rf -- "$candidate"
             done
             df -h /opt/aprendo/runtime /var/lib/aprendo'

      - name: Guard production disk capacity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             runtime=/opt/aprendo/runtime
             current="$runtime/current"
             min_free_kb=1048576
             active_kb=0
             if [ -L "$current" ]; then
               active="$(readlink -f "$current")"
               if [ -d "$active" ]; then active_kb="$(du -sk "$active" | cut -f1)"; fi
             fi
             required_kb=$((active_kb * 3))
             if [ "$required_kb" -lt "$min_free_kb" ]; then required_kb="$min_free_kb"; fi
             set -- $(df -Pk "$runtime" | tail -1)
             available_kb="$4"
             printf "disk guard: active=%s KiB available=%s KiB required=%s KiB\n" "$active_kb" "$available_kb" "$required_kb"
             if [ "$available_kb" -lt "$required_kb" ]; then
               echo "Insufficient free space for a safe Aprendo deployment." >&2
               exit 1
             fi'

      - name: Prepare immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          cleanup_failed_stage() {
            status=$?
            trap - ERR
            set +e
            echo "Cleaning failed staged release $RELEASE_SHA"
            ssh \
              -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$VPS_USER@$VPS_HOST" \
              "set -euo pipefail; release=/opt/aprendo/runtime/releases/$RELEASE_SHA; current=\$(readlink -f /opt/aprendo/runtime/current 2>/dev/null || true); if [ \"\$release\" != \"\$current\" ]; then rm -rf -- \"\$release\"; fi" || true
            exit "$status"
          }
          trap cleanup_failed_stage ERR

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA=$RELEASE_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          runtime=/opt/aprendo/runtime
          releases="$runtime/releases"
          release="$releases/$RELEASE_SHA"
          current="$(readlink -f "$runtime/current" 2>/dev/null || true)"

          rm -rf -- "$release" "$runtime"/.current-next-*
          mapfile -t candidates < <(find "$releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | awk '{print $2}')
          kept=0
          for candidate in "${candidates[@]}"; do
            if [ -n "$current" ] && [ "$candidate" = "$current" ]; then
              continue
            fi
            kept=$((kept + 1))
            if [ "$kept" -gt 2 ]; then
              rm -rf -- "$candidate"
            fi
          done

          mkdir -p "$release"
          df -Pk "$runtime" /var/lib/aprendo
          REMOTE

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/opt/aprendo/runtime/releases/$RELEASE_SHA/"

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            package.json package-lock.json \
            "$VPS_USER@$VPS_HOST:/opt/aprendo/runtime/releases/$RELEASE_SHA/"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA=$RELEASE_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          runtime=/opt/aprendo/runtime
          release="$runtime/releases/$RELEASE_SHA"
          cd "$release"
          export PATH=/opt/aprendo-node/bin:$PATH
          export npm_config_cache="$release/.npm-cache"
          npm ci --omit=dev --no-audit --no-fund
          rm -rf -- "$npm_config_cache"
          test -f server/entry.mjs
          test -d client/_astro

          max_release_kb=524288
          release_kb="$(du -sk "$release" | cut -f1)"
          printf 'installed release size: %s KiB (limit %s KiB)\n' "$release_kb" "$max_release_kb"
          if [ "$release_kb" -gt "$max_release_kb" ]; then
            echo "Installed release exceeds the 512 MiB deployment budget." >&2
            exit 1
          fi

          min_remaining_kb=524288
          set -- $(df -Pk "$runtime" | tail -1)
          available_kb="$4"
          printf 'free space after staging: %s KiB (minimum %s KiB)\n' "$available_kb" "$min_remaining_kb"
          if [ "$available_kb" -lt "$min_remaining_kb" ]; then
            echo "Staged release leaves insufficient free disk headroom." >&2
            exit 1
          fi
          REMOTE

          trap - ERR

      - name: Upload deployment helpers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ops/backup-sqlite.py ops/activate-release.sh ops/rollback-release.sh ops/verify-production-contract.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Activate release with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; APRENDO_BACKUP_HELPER=/tmp/backup-sqlite.py bash /tmp/activate-release.sh $RELEASE_SHA"

      - name: Verify final production boundary with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          rollback_final() {
            status=$?
            trap - ERR
            set +e
            echo "Final production verification failed; rolling back $RELEASE_SHA" >&2
            ssh \
              -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$VPS_USER@$VPS_HOST" \
              "set -euo pipefail; bash /tmp/rollback-release.sh $RELEASE_SHA"
            rollback_status=$?
            if [ "$rollback_status" -ne 0 ]; then
              echo "WARNING: automatic final rollback failed with status $rollback_status" >&2
            fi
            exit "$status"
          }
          trap rollback_final ERR

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail; bash /tmp/verify-production-contract.sh'

          headers_file="$(mktemp)"
          login_file="$(mktemp)"
          account_headers="$(mktemp)"
          asset_headers="$(mktemp)"
          trap 'rm -f "$headers_file" "$login_file" "$account_headers" "$asset_headers"' EXIT

          status="$(curl \
            --silent \
            --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 20 \
            https://aprendo.molacomer.com/)"

          test "$status" = "303"
          grep -qi '^location: /login/' "$headers_file"
          ! grep -qi '^www-authenticate: Basic' "$headers_file"

          login_status="$(curl --silent --show-error --output "$login_file" --write-out '%{http_code}' https://aprendo.molacomer.com/login/)"
          test "$login_status" = "200"
          grep -q 'name="username"' "$login_file"
          grep -q 'name="password"' "$login_file"

          account_status="$(curl --silent --show-error --dump-header "$account_headers" --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/cuenta/)"
          test "$account_status" = "303"
          grep -qi '^location: /login/' "$account_headers"

          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/api/progress/bateria/)"
          test "$api_status" = "401"

          asset_status="$(curl --silent --show-error --dump-header "$asset_headers" --output /dev/null --write-out '%{http_code}' https://aprendo.molacomer.com/bateria/notation/u1/lectura-diagnostico-a1-a2.musicxml)"
          test "$asset_status" = "303"
          grep -Eqi '^location:[[:space:]]+(https://aprendo\.molacomer\.com)?/login/[[:space:]]*$' "$asset_headers"

          trap - ERR
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'rm -f /opt/aprendo/runtime/.rollback-target' \
            || echo 'WARNING: could not clear finalized rollback metadata' >&2

      - name: Measure deployed footprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
             echo "--- final Aprendo footprint ---"
             df -h /
             du -sh /opt/aprendo-node /opt/aprendo/runtime /var/lib/aprendo 2>/dev/null || true
             du -sh /opt/aprendo/runtime/releases/* 2>/dev/null || true
             echo "--- readable host footprint ---"
             du -x -sh /usr /var /opt /home /boot /snap 2>/dev/null || true'
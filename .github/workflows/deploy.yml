name: Deploy aprendo

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-aprendo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy site with rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          rsync -az \
            --delete-delay \
            --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            site/ \
            "$VPS_USER@$VPS_HOST:/var/www/aprendo.molacomer.com/"

      - name: Verify production over HTTPS
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://aprendo.molacomer.com/ > /dev/null

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://aprendo.molacomer.com/bateria/ > /dev/null

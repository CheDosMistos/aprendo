name: Diagnose full tests

on:
  push:
    branches:
      - chore/learner-facing-language-f1-f7

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test > full-tests.log 2>&1
          status=$?
          cat full-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package relevant source snapshot and migration diff
        run: |
          git diff origin/main...HEAD -- src/courses/bateria/content/pages > learner-content.patch
          tar -czf learner-cleanup-source.tgz \
            tests \
            src/courses/bateria/content/pages \
            src/courses/bateria/curriculum.ts \
            scripts/audit-bateria-learner-language.mjs \
            package.json \
            package-lock.json
      - name: Upload diagnostics and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: full-test-diagnostics
          path: |
            full-tests.log
            learner-cleanup-source.tgz
            learner-content.patch
          if-no-files-found: error
      - name: Preserve test result
        if: steps.tests.outputs.status != '0'
        run: exit 1

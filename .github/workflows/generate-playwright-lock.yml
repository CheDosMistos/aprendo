name: Generate Playwright dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add pinned Playwright test dependency
        run: |
          npm ci --no-audit --no-fund
          npm install --save-dev --save-exact @playwright/test --no-audit --no-fund

      - name: Commit dependency metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add pinned Playwright test dependency'
          git push origin HEAD:${{ github.head_ref }}

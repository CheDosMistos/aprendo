name: Observe Aprendo production

on:
  workflow_run:
    workflows:
      - Deploy aprendo
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  observe:
    if: ${{ github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Observe runtime and disk footprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u

          echo "--- aprendo.service runtime ---"
          /usr/bin/systemctl show aprendo.service --no-pager \
            --property=ActiveState,SubState,MainPID,User,ExecStart,Environment,FragmentPath || true
          pid="$(/usr/bin/systemctl show aprendo.service --property=MainPID --value 2>/dev/null || true)"
          if [ -n "$pid" ] && [ "$pid" != "0" ]; then
            printf 'process cwd: '
            readlink "/proc/$pid/cwd" 2>/dev/null || true
            printf 'process APRENDO_DB_PATH: '
            tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | grep '^APRENDO_DB_PATH=' || echo '<unset or unreadable>'
            echo "open Aprendo/SQLite descriptors:"
            ls -l "/proc/$pid/fd" 2>/dev/null | grep -E 'sqlite|/var/lib/aprendo|/opt/aprendo' || true
          fi

          echo "--- deploy sudo policy ---"
          sudo -n -l 2>&1 || true

          echo "--- current release ---"
          active="$(readlink -f /opt/aprendo/runtime/current 2>/dev/null || true)"
          printf 'active release: %s\n' "${active:-<none>}"
          ls -ld /opt/aprendo /opt/aprendo/runtime /opt/aprendo/runtime/current /opt/aprendo/runtime/server 2>/dev/null || true

          echo "--- filesystem capacity ---"
          df -h /
          df -B1 /

          echo "--- Aprendo top-level footprint ---"
          for path in /opt/aprendo /opt/aprendo-node /opt/aprendo/runtime /opt/aprendo/runtime/releases /var/lib/aprendo; do
            [ -e "$path" ] || continue
            du -sh "$path" 2>/dev/null || true
          done

          echo "--- releases and components ---"
          for release in /opt/aprendo/runtime/releases/*; do
            [ -d "$release" ] || continue
            marker='inactive'
            if [ -n "$active" ] && [ "$(readlink -f "$release")" = "$active" ]; then marker='ACTIVE'; fi
            printf '%s %s\n' "$marker" "$release"
            du -sh "$release" 2>/dev/null || true
            for part in node_modules server client; do
              [ -e "$release/$part" ] && du -sh "$release/$part" 2>/dev/null || true
            done
          done

          echo "--- persistent data ---"
          du -sh /var/lib/aprendo/backups /var/lib/aprendo/avatars 2>/dev/null || true
          ls -lh /var/lib/aprendo/aprendo.sqlite* 2>/dev/null || true
          du -h /var/lib/aprendo/aprendo.sqlite* 2>/dev/null || true

          echo "--- other readable Aprendo paths and sizes ---"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -d "$path" ]; then
              du -sh "$path" 2>/dev/null || printf '?\t%s\n' "$path"
            else
              du -h "$path" 2>/dev/null || printf '?\t%s\n' "$path"
            fi
          done < <(find /opt /var/lib /var/log -xdev -maxdepth 4 -iname '*aprendo*' -print 2>/dev/null | sort -u)

          echo "--- one-time Nginx migration helper readiness ---"
          if [ -f /tmp/aprendo-configure-nginx-platform-proxy.py ]; then
            ls -l /tmp/aprendo-configure-nginx-platform-proxy.py
            sha256sum /tmp/aprendo-configure-nginx-platform-proxy.py
          else
            echo '<helper not present>'
          fi

          echo "--- readable Nginx Aprendo references ---"
          for root in /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d; do
            [ -d "$root" ] || continue
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              printf '# %s\n' "$file"
              grep -nE 'listen|server_name|auth_basic|location|proxy_pass|auth_request|error_page' "$file" 2>/dev/null || true
            done < <(grep -RIl 'aprendo\.molacomer\.com' "$root" 2>/dev/null || true)
          done
          REMOTE

      - name: Observe HTTPS boundary
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            url="$2"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl \
              --silent \
              --show-error \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 20 \
              "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print; exit}' "$headers")"
            if grep -qi '^www-authenticate:[[:space:]]*Basic' "$headers"; then basic_auth=yes; else basic_auth=no; fi
            printf '%s code=%s location=%s basic_auth=%s bytes=%s\n' \
              "$label" "${code:-<curl-error>}" "${location:-<none>}" "$basic_auth" "$(wc -c < "$body")"
            rm -f "$headers" "$body"
          }

          probe root https://aprendo.molacomer.com/
          probe login https://aprendo.molacomer.com/login/
          probe account https://aprendo.molacomer.com/cuenta/
          probe private_api https://aprendo.molacomer.com/api/progress/bateria/
          probe private_asset https://aprendo.molacomer.com/bateria/notation/u1/lectura-diagnostico-a1-a2.musicxml
          probe health https://aprendo.molacomer.com/api/health/
